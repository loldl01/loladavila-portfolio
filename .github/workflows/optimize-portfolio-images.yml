name: Optimize portfolio images once

on:
  push:
    branches:
      - codex/optimize-images-soft-edges
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: codex/optimize-images-soft-edges
          fetch-depth: 0

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Optimize large portfolio images
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' image; do
            size=$(stat -c %s "$image")
            if [ "$size" -le 1048576 ]; then
              continue
            fi

            extension=${image##*.}
            temporary=$(mktemp --suffix=".${extension}")

            if [[ "${extension,,}" == "png" ]]; then
              convert "$image" -auto-orient -resize '2560x2560>' -strip \
                -define png:compression-level=9 "$temporary"
            else
              convert "$image" -auto-orient -resize '2560x2560>' -strip \
                -sampling-factor 4:2:0 -interlace Plane -quality 88 "$temporary"
            fi

            if [ "$(stat -c %s "$temporary")" -lt "$size" ]; then
              mv "$temporary" "$image"
            else
              unlink "$temporary"
            fi
          done < <(find Assets -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0)

      - name: Commit optimized images and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/optimize-portfolio-images.yml
          git add Assets
          git commit -m "Optimize portfolio image delivery"
          git push origin HEAD:codex/optimize-images-soft-edges
